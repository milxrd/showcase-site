allowBuilds:
  contentlayer2: true
  cypress: true
  esbuild: true
  protobufjs: false
  unrs-resolver: true

overrides:
  toml@<4.2.0: ^4.2.0
  uuid@<11.1.1: ^11.1.1
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0
  '@jimp/core>file-type': ^21.3.1

patchedDependencies:
  '@jimp/core@0.22.12': patches/@jimp__core@0.22.12.patch
  '@opentelemetry/core@1.30.1': patches/@opentelemetry__core@1.30.1.patch

auditConfig:
  ignoreGhsas:
    # @opentelemetry/core 1.30.1 (pinned by contentlayer2's tracing SDK, which
    # cannot load core 2.x). The upstream fix is backported in
    # patches/@opentelemetry__core@1.30.1.patch; remove this once contentlayer2
    # moves to OpenTelemetry 2.x.
    - GHSA-8988-4f7v-96qf
